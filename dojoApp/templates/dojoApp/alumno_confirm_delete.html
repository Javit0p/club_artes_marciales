{% extends 'dojoApp/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center">
                <h3>¿Confirmar eliminación?</h3>
                <p>Estás a punto de borrar del registro a <strong>{{ object.nombre }} {{ object.apellido }}</strong>.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                    <a href="{% url 'dojo:lista_alumnos' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
