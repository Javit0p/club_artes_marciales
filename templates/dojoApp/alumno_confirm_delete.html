{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center">
            <div class="card shadow border-0 p-4">
                <h4 class="text-danger">¿Eliminar Alumno?</h4>
                <p class="text-muted">¿Estás seguro de que deseas eliminar a <strong>{{ alumno.nombre }}</strong>? Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'alumno_list' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
