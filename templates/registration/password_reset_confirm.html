{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4 rounded-3">
                <h4 class="mb-3 text-primary text-center fw-bold">Ingresar Nueva Contraseña</h4>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3 text-start">
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                        <div class="form-text small text-muted">{{ field.help_text }}</div>
                        {% endif %}
                        {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100 mt-2 fw-bold">Cambiar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
