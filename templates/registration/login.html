{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold text-primary mb-3">Iniciar Sesión</h3>
                    <p class="text-muted text-center small mb-4">Sistema de Gestión • Club TaeKwonDo QUAUHTLI</p>
                    
                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            Usuario o contraseña incorrectos. Inténtalo de nuevo.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Usuario</label>
                            <input type="text" name="username" class="form-control" required placeholder="Ingrese su usuario">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password" name="password" class="form-control" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Ingresar</button>
                        <div class="text-center mt-3">
                            <a href="{% url 'reset_password' %}" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
