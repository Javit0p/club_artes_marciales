{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 text-center">
                    <h4 class="mb-3 text-primary fw-bold">Recuperar Contraseña</h4>
                    <p class="text-muted small">Ingresa el correo electrónico asociado a tu cuenta para enviarte el enlace de recuperación.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar Enlace</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
