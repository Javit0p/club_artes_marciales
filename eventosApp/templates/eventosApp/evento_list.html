{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Eventos y Torneos</h2>
        <a href="{% url 'evento_create' %}" class="btn btn-primary">+ Crear Evento</a>
    </div>

    <!-- Buscador -->
    <form method="get" class="row g-2 mb-4">
        <div class="col-md-9">
            <input type="text" name="q" value="{{ query }}" class="form-control" placeholder="Buscar por nombre de evento...">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-secondary w-100">Buscar</button>
        </div>
    </form>

    <!-- Lista de tarjetas -->
    <div class="row g-3">
        {% for e in eventos %}
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-primary">{{ e.titulo }}</h5>
                    <p class="card-text text-muted mb-1">📍 <strong>Lugar:</strong> {{ e.lugar }}</p>
                    <p class="card-text text-muted mb-2">📅 <strong>Fecha:</strong> {{ e.fecha }}</p>
                    <p class="card-text small">{{ e.descripcion }}</p>
                </div>
                <div class="card-footer bg-transparent border-0 d-flex justify-content-end gap-2 pb-3">
                    <a href="{% url 'evento_update' e.pk %}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a href="{% url 'evento_delete' e.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center text-muted py-4">No hay eventos registrados.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
