{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">🥋 Transacción: Inscribir Alumno a Evento</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Seleccionar Alumno</label>
                            {{ form.alumno }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Seleccionar Evento</label>
                            {{ form.evento }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Estado del Pago</label>
                            {{ form.estado_pago }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Observaciones</label>
                            {{ form.observaciones }}
                        </div>
                        <div class="d-flex justify-content-between pt-2">
                            <a href="{% url 'inscripcion_list' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Registrar Inscripción</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
