{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Confirmar Cancelación</h5>
                </div>
                <div class="card-body">
                    <p class="fs-5">¿Estás seguro de que deseas cancelar la inscripción del alumno <strong>{{ inscripcion.alumno }}</strong> para el evento <strong>{{ inscripcion.evento }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'inscripcion_list' %}" class="btn btn-secondary">Atrás</a>
                            <button type="submit" class="btn btn-danger">Confirmar Cancelación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
